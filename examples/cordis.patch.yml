# Example wiring for the @asyouwish/dsh-verifier plugin.
#
# Verification mode is OFF by default: nothing here is mounted unless you
# include this snippet. To enable it, apply this patch (or copy the insert
# block into your profile's cordis.patch.yml) and set `enabled: true`.
#
#   dsh --profile headless --patch ./packages/verifier/verifier/examples/cordis.patch.yml "..."
#
# The verifier inherits the calling agent's model route when `provider`/`model`
# are omitted, so no route pair is required below.

- insert:
    - id: verifier
      name: '@asyouwish/dsh-verifier'
      config:
        n: 3
        strategy: score
        # Subagent-backed generation: each candidate is produced by one
        # parallel subagent through `ctx.subagents` (needs a composed provider,
        # default name `spawn`). Omit for raw concurrent model calls.
        # generation: subagent
        maxOutputTokens: 1024
        timeoutMs: 60000
        enabled: true
